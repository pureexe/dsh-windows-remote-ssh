# dsh-windows-remote-ssh bundle patch: mount the remote desktop-control
# plugin. Every key below is a Config field (Schemastery schema); invalid
# values fail the profile load loudly. See README.md "Configuration" for the
# full table.
#
# SSH connection fields may be omitted here and supplied instead through
# SSH_HOST / SSH_PORT / SSH_USER / SSH_PASSWORD / SSH_KEY_PATH /
# SSH_KEY_PASSPHRASE environment variables — handy for CI and for keeping
# credentials out of a checked-in profile.
- insert:
    - id: dsh-windows-remote-ssh
      name: dsh-windows-remote-ssh
      config:
        ssh:
          # Target host. Falls back to env SSH_HOST when omitted.
          host: null
          # Falls back to env SSH_PORT, then 22.
          port: 22
          # Falls back to env SSH_USER.
          user: null
          # Password auth; falls back to env SSH_PASSWORD. Prefer a key below
          # when the target supports it.
          password: null
          # Private key file path; falls back to env SSH_KEY_PATH. Takes
          # priority over password when both resolve.
          privateKeyPath: null
          # Passphrase for an encrypted private key; falls back to env
          # SSH_KEY_PASSPHRASE.
          passphrase: null
          # Reject unknown/changed host keys (default true). Set false only
          # for disposable lab/test targets — never for a real deployment.
          strictHostKeyChecking: true
          # Remote directory name (created under the connected user's %TEMP%)
          # the helper script and per-call request/response files live under.
          # Kept short on purpose: it rides inside a Scheduled Task command
          # line that has a 261-character limit.
          remoteWorkdir: dsh-rssh
        # Register only the `pc_control` tool at startup; it registers the
        # rest (screen_shot, click, app_launch, ...) the first time it's
        # called, saving prompt tokens on every turn until a conversation
        # actually needs them. Set false to register everything immediately.
        lazyToolLoading: true
        # Gate every mutating action (click/type/scroll/key/app_launch) behind
        # approval. Observers (screen_shot/screen_read/app_list) never ask.
        requireApproval: false
        # Window title or executable-path regexes that skip the approval ask.
        # The action still runs through the freshness and process-identity
        # checks and is audit-logged. Empty = ask for every action.
        autoApproveWindows: []
        # Append dsh-windows-remote-ssh session audit events
        # (observed/action) to the session log.
        auditSessionEvents: true
        # Whether a mutating action may bring the target window to the
        # foreground as a fallback when posted input is unavailable.
        # 'never' (default) never steals focus; 'allow' permits the fallback.
        focusFallback: never
        # How screen_shot renders: 'auto' (default) always attaches the
        # captured image as an attachment (the harness's own pipeline adapts
        # it to whatever the current model accepts); 'text' always sends only
        # the text description instead, for a deployment that never wants
        # image bytes leaving the plugin.
        imageMode: auto
        # SSH handshake timeout in milliseconds (1..120000).
        connectTimeoutMs: 20000
        # Per-helper-call timeout in milliseconds (1..300000), on top of the
        # SSH round trip.
        helperTimeoutMs: 30000
        # Longest side of a captured screenshot in pixels (320..7680); larger
        # captures are downscaled before they cross the SSH link.
        maxScreenshotSide: 1600
        # Compare the whole window's accessibility tree before every action
        # and refuse if ANYTHING in it differs from the cited observation -
        # not just the element being addressed (the stale-state boundary).
        # Already skipped automatically for `type` and for `click`/`scroll`
        # by elementId - those re-resolve that exact element by its UIA
        # RuntimeId right before acting and fail loudly if it's gone, so the
        # whole-tree hash adds no safety there. Still applies to
        # coordinate-based `click` and to `key`. Set false only if even
        # those trip too often for a fast-changing target window. Identity
        # (window/pid/exe/title/class/rect) and the observation-age check
        # still apply regardless.
        staleCheckTree: true
        # Compare a fresh pixel hash of the target window before every action
        # and refuse when it differs from the cited observation (the
        # stale-state boundary). Disable only for tooling that mutates the
        # remote screen faster than the check can run.
        staleCheckPixels: true
        # Maximum age in ms of an observation that an action may still base
        # on (1000..600000). Older observations are refused and must be
        # re-observed. Default 300000 (5 minutes) gives the model room for
        # multi-step reasoning between observing and acting; lower this if
        # the remote screen tends to change faster than that.
        maxObservationAgeMs: 300000
        # Cap on cached observations (1..64), LRU-evicted. Actions address
        # observations by the id returned from screen_shot/screen_read.
        maxCachedObservations: 8
        # Cap on accessibility elements one screen_read returns (1..2000).
        maxElements: 500
        # Maximum depth of the accessibility tree walk (1..64).
        maxTreeDepth: 32
        # Truncation length for sanitized model-visible strings (16..10000):
        # window titles, executable paths, element names.
        maxTextLength: 200
        # Back up and restore control text when `type` fails (true = restore
        # the original text; false = leave the partially typed text).
        rollbackEnabled: true
        # Register the `powershell` tool: runs an arbitrary script on the
        # remote host with the connected user's full privileges - not scoped
        # to any window or element, not sandboxed beyond what that account
        # can already do. Categorically more powerful than every other tool
        # this plugin registers, so it is off by default; turn it on only
        # for a deployment where the model is fully trusted with the target
        # machine. Still gated by approval like every other mutating action
        # when enabled.
        enablePowerShellTool: true
        # Per-`powershell`-call timeout in milliseconds (1..600000),
        # independent of helperTimeoutMs since scripts may legitimately run
        # longer. The remote process is killed if it runs past this.
        powerShellTimeoutMs: 30000
        # Cap on stdout/stderr length one `powershell` call returns
        # (1..200000), each truncated independently.
        maxPowerShellOutputLength: 20000
        # Cap on one filesystem_pull/filesystem_push transfer in bytes
        # (1..100000000, i.e. up to 100 MB). A pull of a larger remote file,
        # or a push of larger content, is refused outright rather than
        # truncated - truncating binary content would just corrupt it.
        maxFilesystemTransferBytes: 10000000
        # Above this many bytes (1..maxFilesystemTransferBytes),
        # filesystem_pull saves the file as an attachment (image or generic
        # file) instead of inlining it as text in the tool result, so a
        # merely-large-but-under-the-transfer-cap text file doesn't bloat
        # the model's context.
        maxInlineFilesystemBytes: 100000
        # Default timeout in milliseconds for wait_for when a call doesn't
        # supply its own (500..120000). wait_for polls roughly every 500ms
        # until its condition is met or this elapses; a timeout is returned
        # as a normal result (met: false), never an error.
        waitForTimeoutMs: 10000
        # Default AUMID notify toasts under when a call doesn't supply its
        # own appId. The built-in Windows PowerShell AUMID works on stock
        # Windows 10/11 with no app registration - the standard technique
        # for toasting from PowerShell. Override only if a specific
        # registered app identity is required.
        notifyAppId: "{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\\WindowsPowerShell\\v1.0\\powershell.exe"
        # Cap on the number of sub-actions one multi_action call may batch
        # (1..100). A single tool call staying bounded, not a substitute for
        # a real scripting loop.
        maxMultiActionSteps: 20
        # Cap on the text read_text returns from one element's Text pattern
        # document (1..200000). A document's full text can be much longer
        # than maxTextLength, which is for short sanitized labels like
        # titles, not document bodies.
        maxReadTextLength: 20000
        # Cap on the total number of cells (rows x columns actually read)
        # one read_table call returns (1..5000) - a total-cell cap, not a
        # per-dimension one. A grid bigger than this still reports its true
        # rowCount/columnCount but only populates cells up to the cap and
        # reports truncated: true.
        maxTableCells: 500
